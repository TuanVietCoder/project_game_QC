<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="description" content="Hồ sơ người chơi Ashfall: Viet ID, tên hiển thị, giới thiệu và tiến độ.">
<title>Hồ sơ — Ashfall</title>
<link rel="icon" type="image/jpeg" href="assets/tuanviet-studio-logo.jpg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css?v=6">
<link rel="stylesheet" href="assets/css/app.css?v=6">
<style>
  .hero{
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    background:linear-gradient(180deg, rgba(255,157,71,.10), rgba(207,75,62,.04)), var(--bg-plate);
  }
  .hero__meta{ flex:1; min-width:180px; }
  .hero__ten{ font-family:var(--font-display); font-weight:700; font-size:clamp(1.4rem,4.5vw,1.9rem); line-height:1.25; }
  .hero__id{ font-family:var(--font-mono); font-size:.85rem; color:var(--muted-2); margin-top:4px; }
  .hero__id b{ color:var(--muted); font-weight:600; }
  .the-vai{
    display:inline-block; margin:9px 7px 0 0;
    font-family:var(--font-mono); font-size:10px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase;
    border:1px solid var(--line-strong); border-radius:999px; padding:4px 11px; color:var(--muted);
  }
  .the-vai.admin{ color:#1a1208; background:var(--ember); border-color:var(--ember); }
  .the-vai.mod{ color:var(--moss); border-color:var(--moss); }
  .the-vai.canh{ color:var(--crack); border-color:var(--crack); }
  .hero__tham{ font-size:.85rem; color:var(--muted-2); margin-top:9px; }

  label{
    display:block; font-family:var(--font-mono); font-size:10.5px;
    letter-spacing:.13em; text-transform:uppercase; color:var(--muted-2); margin:0 0 7px;
  }
  input, textarea{
    width:100%; padding:12px 14px; margin-bottom:17px;
    background:var(--bg-plate-2); color:var(--ink);
    border:1px solid var(--line-strong); border-radius:8px;
    font-family:var(--font-body); font-size:.95rem; resize:vertical;
  }
  input:focus, textarea:focus{ outline:none; border-color:var(--ember-dim); }
  input:disabled{ color:var(--muted-2); cursor:not-allowed; }
  .dem-chu{ font-family:var(--font-mono); font-size:.78rem; color:var(--muted-2); margin:-11px 0 17px; }
  /* khối đổi ảnh đại diện */
  .anh{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .anh__nut{ display:flex; gap:9px; flex-wrap:wrap; }
  .anh__y{ font-size:.82rem; color:var(--muted-2); margin:9px 0 0; flex-basis:100%; }
  .anh input[type=file]{ display:none; }
  .ash-ava--to.dang-tai{ opacity:.45; }

  .an{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .an span{
    width:34px; height:34px; border-radius:9px; display:grid; place-items:center;
    border:1px dashed var(--line-strong); color:var(--muted-2);
    font-family:var(--font-mono); font-size:11px;
  }

  @media (max-width:520px){
    /* màn hẹp: xếp dọc, căn giữa cho đỡ lệch */
    .hero{ flex-direction:column; text-align:center; gap:14px; }
    .hero__meta{ min-width:0; }
    .ash-ava--to{ width:76px; height:76px; font-size:1.8rem; }
  }
</style>
</head>
<body>
<p id="loading" style="padding:70px 16px;text-align:center;color:#75695a;font-family:ui-monospace,monospace">Đang tải…</p>
<script>
  // Nếu 8 giây nữa mà #loading vẫn còn thì module đã chết lúc nạp (thường do
  // trình duyệt giữ bản JS cũ). Nói thẳng ra, đừng treo mãi ở "Đang tải…".
  setTimeout(function () {
    var l = document.getElementById("loading");
    if (l && !l.hidden) l.textContent = "Không tải được trang. Bấm Ctrl+Shift+R để nạp lại.";
  }, 8000);
</script>

<script type="module">
import { supabase, vietId, tenHienThi, quenHoSo, dichLoi } from './assets/js/auth.js?v=6';
import { dungKhung, el, veAva } from './assets/js/app.js?v=6';

const { main, me } = await dungKhung('ho-so');
document.getElementById('loading').remove();

// --------------------------------------------------------------- thẻ hồ sơ ---
const hero = el('section', 'ash-the hero');
const meta = el('div', 'hero__meta');
const ten = el('div', 'hero__ten', tenHienThi(me));
const idline = el('div', 'hero__id');
idline.append('Viet ID: ', el('b', null, vietId(me)));
meta.append(ten, idline);

if (me.role === 'admin') meta.append(el('span', 'the-vai admin', 'Quản trị viên'));
else if (me.role === 'moderator') meta.append(el('span', 'the-vai mod', 'Kiểm duyệt viên'));
else meta.append(el('span', 'the-vai', 'Người chơi'));
if (me.status === 'suspended') meta.append(el('span', 'the-vai canh', 'Tạm khóa'));
if (me.status === 'banned') meta.append(el('span', 'the-vai canh', 'Bị cấm'));

meta.append(el('div', 'hero__tham', 'Tham gia ' + new Date(me.created_at).toLocaleDateString('vi-VN')));
const ava = veAva(me, 'ash-ava ash-ava--to');
hero.append(ava, meta);
main.append(hero);

// ------------------------------------------------------------------ biểu mẫu ---
const hopSua = el('section', 'ash-the');
hopSua.append(el('h2', null, 'Chỉnh sửa hồ sơ'));
const form = el('form');
form.innerHTML = `
  <label for="email">Email (không đổi được ở đây)</label>
  <input id="email" type="email" disabled>

  <label for="display_name">Tên hiển thị</label>
  <input id="display_name" type="text" maxlength="32" placeholder="Tên người khác nhìn thấy">

  <label for="avatar_url">Hoặc dán đường dẫn ảnh</label>
  <input id="avatar_url" type="url" placeholder="https://..." inputmode="url">

  <label for="bio">Giới thiệu</label>
  <textarea id="bio" rows="4" maxlength="300" placeholder="Vài dòng về bạn…"></textarea>
  <p class="dem-chu"><span id="bio-dem">0</span>/300</p>

  <button class="ash-nut" id="luu" type="submit">Lưu thay đổi</button>
`;
const bao = el('div', 'ash-bao');
bao.setAttribute('role', 'status');
bao.setAttribute('aria-live', 'polite');
hopSua.append(form, bao);
main.append(hopSua);

// --------------------------------------------------------- ảnh đại diện ---
const hopAnh = el('section', 'ash-the');
hopAnh.append(el('h2', null, 'Ảnh đại diện'));
const khungAnh = el('div', 'anh');
const avaNho = veAva(me, 'ash-ava ash-ava--to');
const chonFile = el('input');
chonFile.type = 'file';
chonFile.accept = 'image/jpeg,image/png,image/webp,image/gif';
const nutChon = el('button', 'ash-nut', 'Chọn ảnh');
nutChon.type = 'button';
const nutGo = el('button', 'ash-nut ash-nut--vien', 'Gỡ ảnh');
nutGo.type = 'button';
nutGo.hidden = !me.avatar_url;
const cumNut = el('div', 'anh__nut');
cumNut.append(nutChon, nutGo);
khungAnh.append(avaNho, cumNut, chonFile,
  el('p', 'anh__y', 'Ảnh vuông đẹp nhất. Nhận JPG, PNG, WEBP hoặc GIF, tối đa 2 MB.'));
hopAnh.append(khungAnh);
const baoAnh = el('div', 'ash-bao');
baoAnh.setAttribute('role', 'status');
baoAnh.setAttribute('aria-live', 'polite');
hopAnh.append(baoAnh);
main.append(hopAnh);

// ------------------------------------------------- tiến độ trong game ---
const td = el('section', 'ash-the');
td.append(el('h2', null, 'Tiến độ trong game'));
td.append(el('div', 'ash-trong', 'Chưa có dữ liệu. Phần này sẽ hiện Nghiệp Ấn đã thu và boss đã hạ khi game nối với tài khoản.'));
const an = el('div', 'an');
for (let i = 1; i <= 7; i++) an.append(el('span', null, String(i).padStart(2, '0')));
td.append(an);
main.append(td);

// ---------------------------------------------------------------- xử lý ---
const $ = (id) => document.getElementById(id);
const noi = (text, kieu) => { bao.textContent = text; bao.className = `ash-bao hien ${kieu}`; };

$('email').value = me.email ?? '';
$('display_name').value = me.display_name ?? '';
$('avatar_url').value = me.avatar_url ?? '';
$('bio').value = me.bio ?? '';
$('bio-dem').textContent = (me.bio ?? '').length;
$('bio').addEventListener('input', (e) => { $('bio-dem').textContent = e.target.value.length; });

// --------------------------------------------------- đổi ảnh đại diện ---
const noiAnh = (text, kieu) => { baoAnh.textContent = text; baoAnh.className = `ash-bao hien ${kieu}`; };

/** Vẽ lại cả hai chỗ đang hiện ảnh: thẻ hồ sơ trên đầu và ô xem trước. */
function datAnh(url) {
  me.avatar_url = url || null;
  for (const e of [ava, avaNho]) {
    if (url) { e.textContent = ''; e.style.backgroundImage = `url("${url.replace(/"/g, '%22')}")`; }
    else { e.style.backgroundImage = ''; e.textContent = (me.display_name || me.username).charAt(0).toUpperCase(); }
  }
  $('avatar_url').value = url || '';
  nutGo.hidden = !url;
}

async function luuAnh(url) {
  const { error } = await supabase.from('profiles').update({ avatar_url: url }).eq('id', me.id);
  if (error) throw error;
  quenHoSo();                                   // thanh trên và khung chat đọc lại
  datAnh(url);
}

nutChon.onclick = () => chonFile.click();

chonFile.onchange = async () => {
  const file = chonFile.files?.[0];
  chonFile.value = '';                          // chọn lại cùng file vẫn kêu onchange
  if (!file) return;

  // Hai lượt kiểm dưới đây CHỈ để báo sớm cho dễ chịu. Chặn thật nằm ở bucket
  // (file_size_limit + allowed_mime_types) trong supabase/anh-dai-dien.sql.
  if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) {
    return noiAnh('Chỉ nhận ảnh JPG, PNG, WEBP hoặc GIF.', 'loi');
  }
  if (file.size > 2 * 1024 * 1024) {
    return noiAnh(`Ảnh nặng ${(file.size / 1048576).toFixed(1)} MB, tối đa 2 MB.`, 'loi');
  }

  nutChon.disabled = true;
  nutChon.textContent = 'Đang tải lên…';
  avaNho.classList.add('dang-tai');
  try {
    // Một người một file, ghi đè lên chính nó — khỏi để lại rác trong bucket.
    // Không đặt đuôi file: trình duyệt đọc Content-Type chứ không đọc đuôi.
    const duong = `${me.id}/avatar`;
    const { error: loiTai } = await supabase.storage.from('avatars')
      .upload(duong, file, { upsert: true, contentType: file.type, cacheControl: '3600' });
    if (loiTai) throw loiTai;

    const { data } = supabase.storage.from('avatars').getPublicUrl(duong);
    // Cùng một đường dẫn nên phải thêm mốc thời gian, không thì trình duyệt
    // hiện lại ảnh cũ trong cache.
    const noi_ = data.publicUrl.includes('?') ? '&' : '?';
    await luuAnh(`${data.publicUrl}${noi_}t=${Date.now()}`);
    noiAnh('Đã đổi ảnh đại diện.', 'xong');
  } catch (err) {
    noiAnh(dichLoi(err.message), 'loi');
  } finally {
    nutChon.disabled = false;
    nutChon.textContent = 'Chọn ảnh';
    avaNho.classList.remove('dang-tai');
  }
};

nutGo.onclick = async () => {
  nutGo.disabled = true;
  try {
    await supabase.storage.from('avatars').remove([`${me.id}/avatar`]);
    await luuAnh(null);
    noiAnh('Đã gỡ ảnh đại diện.', 'xong');
  } catch (err) {
    noiAnh(dichLoi(err.message), 'loi');
  } finally {
    nutGo.disabled = false;
  }
};

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const avatar_url = $('avatar_url').value.trim();
  if (avatar_url && !/^https:\/\//i.test(avatar_url)) {
    return noi('Đường dẫn ảnh phải bắt đầu bằng https://', 'loi');
  }

  const btn = $('luu');
  btn.disabled = true;
  btn.textContent = 'Đang lưu…';
  try {
    const { error } = await supabase.from('profiles').update({
      display_name: $('display_name').value.trim() || null,
      avatar_url:   avatar_url || null,
      bio:          $('bio').value.trim() || null,
    }).eq('id', me.id);
    if (error) throw error;

    quenHoSo();                                   // để nơi khác đọc được tên mới
    me.display_name = $('display_name').value.trim() || null;
    ten.textContent = tenHienThi(me);
    datAnh(avatar_url || null);
    noi('Đã lưu hồ sơ.', 'xong');
  } catch (err) {
    noi(dichLoi(err.message), 'loi');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Lưu thay đổi';
  }
});
</script>
<script type="module" src="assets/js/chat.js?v=6"></script>
</body>
</html>
