<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="description" content="Tìm người chơi Ashfall theo Riot ID, gửi lời mời kết bạn và quản lý danh sách bạn bè.">
<title>Bạn bè — Ashfall</title>
<link rel="icon" type="image/jpeg" href="assets/tuanviet-studio-logo.jpg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  body{
    min-height:100vh;
    background:radial-gradient(ellipse 900px 520px at 50% -8%, rgba(255,157,71,.12), transparent 62%), var(--bg);
    color:var(--ink); font-family:var(--font-body); line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:720px; margin:0 auto; padding:26px 26px 70px; }

  .top{ display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:30px; }
  .top a{ font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  h1{ font-family:var(--font-display); font-size:clamp(1.7rem,5vw,2.3rem); margin:0 0 26px; }

  /* ô tìm kiếm */
  .search{ display:flex; gap:10px; margin-bottom:10px; }
  .search input{
    flex:1; padding:13px 15px;
    background:var(--bg-plate-2); color:var(--ink);
    border:1px solid var(--line-strong); border-radius:8px;
    font-family:var(--font-body); font-size:.97rem;
  }
  .search input:focus{ outline:none; border-color:var(--ember-dim); }
  .search button{
    padding:13px 22px; border:none; border-radius:8px; cursor:pointer;
    background:var(--ember); color:#1a1208;
    font-family:var(--font-mono); font-size:11.5px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase;
  }
  .search button:disabled{ opacity:.55; cursor:progress; }
  .tip{ font-size:.82rem; color:var(--muted-2); margin:0 0 28px; }

  /* thẻ người chơi */
  .list{ display:flex; flex-direction:column; gap:10px; }
  .person{
    display:flex; align-items:center; gap:14px;
    background:var(--bg-plate); border:1px solid var(--line);
    border-radius:11px; padding:14px 16px;
  }
  .ava{
    width:46px; height:46px; flex:none; border-radius:50%;
    border:1.5px solid var(--ember-dim); background:var(--bg-plate-2) center/cover no-repeat;
    display:grid; place-items:center;
    font-family:var(--font-display); font-weight:700; font-size:1.15rem; color:var(--ember);
  }
  .who{ flex:1; min-width:0; }
  .who .id{ font-weight:600; }
  .who .id .t{ font-family:var(--font-mono); font-size:.85rem; color:var(--muted-2); }
  .who .sub{ font-size:.83rem; color:var(--muted-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acts{ display:flex; gap:8px; flex-wrap:wrap; }
  .act{
    border:1px solid var(--line-strong); border-radius:999px; background:transparent;
    color:var(--muted); cursor:pointer; padding:8px 14px;
    font-family:var(--font-mono); font-size:10px; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; white-space:nowrap;
  }
  .act:hover:not(:disabled){ color:var(--ink); border-color:var(--ember-dim); }
  .act.primary{ background:var(--ember); border-color:var(--ember); color:#1a1208; }
  .act.danger:hover:not(:disabled){ color:var(--crack); border-color:var(--crack); }
  .act:disabled{ opacity:.5; cursor:default; }
  .state{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted-2); white-space:nowrap;
  }

  section{ margin-top:38px; }
  h2{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--muted-2); margin:0 0 15px;
    display:flex; align-items:center; gap:9px;
  }
  h2 .n{
    background:var(--ember); color:#1a1208; border-radius:999px;
    padding:1px 8px; font-size:10px;
  }
  .empty{
    background:var(--bg-plate); border:1px dashed var(--line-strong);
    border-radius:11px; padding:20px; color:var(--muted-2); font-size:.9rem;
  }
  .msg{ margin:16px 0 0; padding:13px 15px; border-radius:8px; font-size:.9rem; display:none; }
  .msg.show{ display:block; }
  .msg.err{ background:rgba(207,75,62,.12); border:1px solid var(--crack); color:#f0b3ac; }
  .msg.ok{ background:rgba(143,168,127,.12); border:1px solid var(--moss); color:#cfe0c4; }
  #loading{ padding:70px 0; text-align:center; color:var(--muted-2); font-family:var(--font-mono); font-size:.9rem; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <p id="loading">Đang tải…</p>

  <div id="app" hidden>
    <div class="top">
      <a href="index.html">← Trang chủ</a>
      <a href="ho-so.html">Hồ sơ của tôi →</a>
    </div>

    <h1>Bạn bè</h1>

    <form class="search" id="search-form">
      <input id="q" type="search" placeholder="Tìm theo Riot ID, ví dụ TuanViet hoặc TuanViet#0417"
             autocomplete="off" aria-label="Tìm người chơi">
      <button type="submit" id="search-btn">Tìm</button>
    </form>
    <p class="tip">Gõ tên để tìm gần đúng, hoặc cả <strong>tên#thẻ</strong> để tìm chính xác một người.</p>

    <div class="msg" id="msg" role="status" aria-live="polite"></div>

    <section id="sec-results" hidden>
      <h2>Kết quả tìm kiếm</h2>
      <div class="list" id="results"></div>
    </section>

    <section id="sec-incoming" hidden>
      <h2>Lời mời đang chờ bạn <span class="n" id="n-incoming"></span></h2>
      <div class="list" id="incoming"></div>
    </section>

    <section>
      <h2>Danh sách bạn <span class="n" id="n-friends" hidden></span></h2>
      <div class="list" id="friends"></div>
      <div class="empty" id="friends-empty">Chưa có ai. Dùng ô tìm kiếm phía trên để kết bạn.</div>
    </section>

    <section id="sec-outgoing" hidden>
      <h2>Lời mời bạn đã gửi</h2>
      <div class="list" id="outgoing"></div>
    </section>

    <section id="sec-blocked" hidden>
      <h2>Đã chặn</h2>
      <div class="list" id="blocked"></div>
    </section>
  </div>
</div>

<script type="module">
import { supabase, getProfile, dichLoi } from './assets/js/auth.js';

const $ = (id) => document.getElementById(id);
const show = (text, kind) => { const m = $('msg'); m.textContent = text; m.className = `msg show ${kind}`; };
const clearMsg = () => { $('msg').className = 'msg'; };

const me = await getProfile();
if (!me) { location.replace('dang-nhap.html'); throw new Error('chưa đăng nhập'); }
$('loading').hidden = true;
$('app').hidden = false;

// ---------------------------------------------------------------- vẽ thẻ ---
function card(p, actions) {
  const el = document.createElement('div');
  el.className = 'person';

  const ava = document.createElement('div');
  ava.className = 'ava';
  if (p.avatar_url) ava.style.backgroundImage = `url("${p.avatar_url.replace(/"/g, '%22')}")`;
  else ava.textContent = (p.display_name || p.username || '?').charAt(0).toUpperCase();

  const who = document.createElement('div');
  who.className = 'who';
  const id = document.createElement('div');
  id.className = 'id';
  id.textContent = p.username;
  const t = document.createElement('span');
  t.className = 't';
  t.textContent = '#' + p.tag;
  id.append(t);
  who.append(id);
  if (p.display_name && p.display_name !== p.username) {
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = p.display_name;
    who.append(sub);
  }

  const acts = document.createElement('div');
  acts.className = 'acts';
  for (const a of actions) {
    if (a.label === null) {                       // chỉ hiện chữ trạng thái
      const s = document.createElement('span');
      s.className = 'state';
      s.textContent = a.text;
      acts.append(s);
      continue;
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'act' + (a.cls ? ' ' + a.cls : '');
    b.textContent = a.label;
    b.onclick = async () => {
      acts.querySelectorAll('button').forEach((x) => (x.disabled = true));
      clearMsg();
      try { await a.run(); await refresh(); }
      catch (err) { show(dichLoi(err.message), 'err'); acts.querySelectorAll('button').forEach((x) => (x.disabled = false)); }
    };
    acts.append(b);
  }

  el.append(ava, who, acts);
  return el;
}

// ------------------------------------------------------------- hành động ---
const pairOf = (otherId) => ({
  user_a: me.id < otherId ? me.id : otherId,
  user_b: me.id < otherId ? otherId : me.id,
});

const guiLoiMoi = (id) =>
  supabase.rpc('gui_loi_moi', { ban_id: id }).then(({ error }) => { if (error) throw error; });

const doiTrangThai = (id, status) => {
  const { user_a, user_b } = pairOf(id);
  return supabase.from('friendships').update({ status }).eq('user_a', user_a).eq('user_b', user_b)
    .then(({ error }) => { if (error) throw error; });
};

const xoaQuanHe = (id) => {
  const { user_a, user_b } = pairOf(id);
  return supabase.from('friendships').delete().eq('user_a', user_a).eq('user_b', user_b)
    .then(({ error }) => { if (error) throw error; });
};

const chan = async (id) => {
  await supabase.rpc('gui_loi_moi', { ban_id: id });        // đảm bảo có hàng
  const { user_a, user_b } = pairOf(id);
  const { error } = await supabase.from('friendships')
    .update({ status: 'blocked', requested_by: me.id })
    .eq('user_a', user_a).eq('user_b', user_b);
  if (error) throw error;
};

// --------------------------------------------------------------- tải lại ---
async function refresh() {
  const { data, error } = await supabase.rpc('danh_sach_ban');
  if (error) return show(dichLoi(error.message), 'err');

  const friends  = data.filter((r) => r.status === 'accepted');
  const incoming = data.filter((r) => r.status === 'pending' && !r.toi_gui);
  const outgoing = data.filter((r) => r.status === 'pending' && r.toi_gui);
  const blocked  = data.filter((r) => r.status === 'blocked');

  // bạn bè
  const fl = $('friends');
  fl.replaceChildren(...friends.map((p) => card(p, [
    { label: 'Huỷ kết bạn', cls: 'danger', run: () => xoaQuanHe(p.id) },
    { label: 'Chặn', cls: 'danger', run: () => chan(p.id) },
  ])));
  $('friends-empty').hidden = friends.length > 0;
  $('n-friends').hidden = friends.length === 0;
  $('n-friends').textContent = friends.length;

  // lời mời đến
  $('sec-incoming').hidden = incoming.length === 0;
  $('n-incoming').textContent = incoming.length;
  $('incoming').replaceChildren(...incoming.map((p) => card(p, [
    { label: 'Đồng ý', cls: 'primary', run: () => doiTrangThai(p.id, 'accepted') },
    { label: 'Từ chối', run: () => xoaQuanHe(p.id) },
    { label: 'Chặn', cls: 'danger', run: () => chan(p.id) },
  ])));

  // lời mời đã gửi
  $('sec-outgoing').hidden = outgoing.length === 0;
  $('outgoing').replaceChildren(...outgoing.map((p) => card(p, [
    { label: null, text: 'Đang chờ' },
    { label: 'Thu hồi', run: () => xoaQuanHe(p.id) },
  ])));

  // đã chặn
  $('sec-blocked').hidden = blocked.length === 0;
  $('blocked').replaceChildren(...blocked.map((p) => card(p, [
    { label: 'Bỏ chặn', run: () => xoaQuanHe(p.id) },
  ])));
}

// -------------------------------------------------------------- tìm kiếm ---
const NHAN = {
  ban_be:         'Đã là bạn',
  da_gui:         'Đã gửi lời mời',
  cho_minh_duyet: 'Đang chờ bạn duyệt',
  chan:           'Đã chặn',
};

$('search-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = $('q').value.trim();
  clearMsg();
  if (q.length < 2) return show('Nhập ít nhất 2 ký tự để tìm.', 'err');

  const btn = $('search-btn');
  btn.disabled = true;
  try {
    const { data, error } = await supabase.rpc('tim_nguoi_choi', { tu_khoa: q });
    if (error) throw error;

    $('sec-results').hidden = false;
    if (!data.length) {
      $('results').replaceChildren(
        Object.assign(document.createElement('div'),
          { className: 'empty', textContent: `Không tìm thấy ai khớp với "${q}".` }));
      return;
    }
    $('results').replaceChildren(...data.map((p) => card(p, [
      p.trang_thai === 'chua'
        ? { label: 'Kết bạn', cls: 'primary', run: () => guiLoiMoi(p.id) }
        : { label: null, text: NHAN[p.trang_thai] },
    ])));
  } catch (err) {
    show(dichLoi(err.message), 'err');
  } finally {
    btn.disabled = false;
  }
});

await refresh();
</script>
</body>
</html>
