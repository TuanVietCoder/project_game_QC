<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="description" content="Tìm người chơi Ashfall theo Riot ID, gửi lời mời kết bạn và quản lý danh sách bạn bè.">
<title>Bạn bè — Ashfall</title>
<link rel="icon" type="image/jpeg" href="assets/tuanviet-studio-logo.jpg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .tim{ display:flex; gap:9px; }
  .tim input{
    flex:1; min-width:0; padding:12px 14px;
    background:var(--bg-plate-2); color:var(--ink);
    border:1px solid var(--line-strong); border-radius:9px;
    font-family:var(--font-body); font-size:16px;   /* 16px để iOS không tự phóng to trang */
  }
  .tim input:focus{ outline:none; border-color:var(--ember-dim); }
  .goi-y{ font-size:.82rem; color:var(--muted-2); margin:11px 0 0; }

  /* hàng người chơi có thêm cụm nút bên phải */
  .ash-nguoi{ flex-wrap:wrap; }
  .viec{ display:flex; gap:7px; flex-wrap:wrap; margin-left:auto; }
  .viec .trang-thai{
    font-family:var(--font-mono); font-size:10px; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color:var(--muted-2);
    align-self:center; padding:0 4px;
  }
  .ash-nut--do{ background:transparent; color:var(--crack); border:1px solid rgba(207,75,62,.45); }
  .ash-nut--do:hover{ background:rgba(207,75,62,.12); filter:none; }
  @media (max-width:560px){
    .viec{ margin-left:0; width:100%; padding-left:54px; }
  }
</style>
</head>
<body>
<p id="loading" style="padding:70px 16px;text-align:center;color:#75695a;font-family:ui-monospace,monospace">Đang tải…</p>

<script type="module">
import { supabase, dichLoi } from './assets/js/auth.js';
import { dungKhung, el, veXuong, hangNguoi, moChat } from './assets/js/app.js';

const { main, me } = await dungKhung('ban-be');
document.getElementById('loading').remove();

// -------------------------------------------------------------- tìm kiếm ---
const hopTim = el('section', 'ash-the');
hopTim.append(el('h2', null, 'Tìm người chơi'));
const form = el('form', 'tim');
const oTim = el('input');
Object.assign(oTim, { type: 'search', autocomplete: 'off',
  placeholder: 'Riot ID, ví dụ TuanViet hoặc TuanViet#0417' });
oTim.setAttribute('aria-label', 'Tìm người chơi');
const nutTim = el('button', 'ash-nut', 'Tìm');
nutTim.type = 'submit';
form.append(oTim, nutTim);
const bao = el('div', 'ash-bao');
bao.setAttribute('role', 'status');
bao.setAttribute('aria-live', 'polite');
hopTim.append(form, el('p', 'goi-y', 'Gõ tên để tìm gần đúng, hoặc cả tên#thẻ để tìm chính xác một người.'), bao);
main.append(hopTim);

const noi = (text, kieu) => { bao.textContent = text; bao.className = `ash-bao hien ${kieu}`; };
const xoaBao = () => { bao.className = 'ash-bao'; };

/** Một mục trong cột giữa; trả về {the, ds, tieu} để đổ dữ liệu vào sau. */
function muc(tieuDe, anKhiRong = true) {
  const the = el('section', 'ash-the');
  const tieu = el('h2', null, tieuDe);
  const ds = el('div');
  the.append(tieu, ds);
  the.hidden = anKhiRong;
  main.append(the);
  return { the, ds, tieu };
}

const mKetQua = muc('Kết quả tìm kiếm');
const mDen    = muc('Lời mời đang chờ bạn');
const mBan    = muc('Danh sách bạn', false);
const mDaGui  = muc('Lời mời bạn đã gửi');
const mChan   = muc('Đã chặn');
mBan.ds.append(veXuong(3));

// ------------------------------------------------------------- vẽ một hàng ---
function hang(p, viecs) {
  const row = hangNguoi(p, null, `${p.username}#${p.tag}`);
  const viec = el('div', 'viec');
  for (const v of viecs) {
    if (v.label === null) { viec.append(el('span', 'trang-thai', v.text)); continue; }
    const b = el('button', 'ash-nut ash-nut--nho' + (v.cls ? ' ' + v.cls : ''), v.label);
    b.type = 'button';
    b.onclick = async () => {
      const nut = [...viec.querySelectorAll('button')];
      nut.forEach((x) => (x.disabled = true));
      xoaBao();
      try {
        await v.run();
        if (v.taiLai !== false) await taiLai();     // taiLai() vẽ lại nên khỏi bật nút
        else nut.forEach((x) => (x.disabled = false));
      } catch (err) {
        noi(dichLoi(err.message), 'loi');
        nut.forEach((x) => (x.disabled = false));
      }
    };
    viec.append(b);
  }
  row.append(viec);
  return row;
}

// ------------------------------------------------------------- hành động ---
// friendships lưu mỗi cặp đúng MỘT hàng với user_a < user_b — xem supabase/friends.sql
const cap = (kia) => ({
  user_a: me.id < kia ? me.id : kia,
  user_b: me.id < kia ? kia : me.id,
});

const guiLoiMoi = (id) =>
  supabase.rpc('gui_loi_moi', { ban_id: id }).then(({ error }) => { if (error) throw error; });

const doiTrangThai = (id, status) => {
  const { user_a, user_b } = cap(id);
  return supabase.from('friendships').update({ status }).eq('user_a', user_a).eq('user_b', user_b)
    .then(({ error }) => { if (error) throw error; });
};

const xoaQuanHe = (id) => {
  const { user_a, user_b } = cap(id);
  return supabase.from('friendships').delete().eq('user_a', user_a).eq('user_b', user_b)
    .then(({ error }) => { if (error) throw error; });
};

const chan = async (id) => {
  await supabase.rpc('gui_loi_moi', { ban_id: id });        // đảm bảo có hàng
  const { user_a, user_b } = cap(id);
  const { error } = await supabase.from('friendships')
    .update({ status: 'blocked', requested_by: me.id })
    .eq('user_a', user_a).eq('user_b', user_b);
  if (error) throw error;
};

// --------------------------------------------------------------- tải lại ---
const demTieu = (m, n) => {
  m.tieu.querySelector('.dem')?.remove();
  if (n) m.tieu.append(el('span', 'dem', String(n)));
};

async function taiLai() {
  const { data, error } = await supabase.rpc('danh_sach_ban');
  if (error) {
    mBan.ds.replaceChildren(el('div', 'ash-trong', 'Không tải được danh sách.'));
    return noi(dichLoi(error.message), 'loi');
  }

  const ban    = data.filter((r) => r.status === 'accepted');
  const den    = data.filter((r) => r.status === 'pending' && !r.toi_gui);
  const daGui  = data.filter((r) => r.status === 'pending' && r.toi_gui);
  const daChan = data.filter((r) => r.status === 'blocked');

  mBan.ds.replaceChildren(...ban.map((p) => hang(p, [
    { label: 'Nhắn tin', run: async () => moChat(p.id), taiLai: false },
    { label: 'Huỷ kết bạn', cls: 'ash-nut--vien', run: () => xoaQuanHe(p.id) },
    { label: 'Chặn', cls: 'ash-nut--do', run: () => chan(p.id) },
  ])));
  if (!ban.length) mBan.ds.append(el('div', 'ash-trong', 'Chưa có ai. Dùng ô tìm kiếm phía trên để kết bạn.'));
  demTieu(mBan, ban.length);

  mDen.the.hidden = den.length === 0;
  demTieu(mDen, den.length);
  mDen.ds.replaceChildren(...den.map((p) => hang(p, [
    { label: 'Đồng ý', run: () => doiTrangThai(p.id, 'accepted') },
    { label: 'Từ chối', cls: 'ash-nut--vien', run: () => xoaQuanHe(p.id) },
    { label: 'Chặn', cls: 'ash-nut--do', run: () => chan(p.id) },
  ])));

  mDaGui.the.hidden = daGui.length === 0;
  mDaGui.ds.replaceChildren(...daGui.map((p) => hang(p, [
    { label: null, text: 'Đang chờ' },
    { label: 'Thu hồi', cls: 'ash-nut--vien', run: () => xoaQuanHe(p.id) },
  ])));

  mChan.the.hidden = daChan.length === 0;
  mChan.ds.replaceChildren(...daChan.map((p) => hang(p, [
    { label: 'Bỏ chặn', cls: 'ash-nut--vien', run: () => xoaQuanHe(p.id) },
  ])));
}

// -------------------------------------------------------------- tìm kiếm ---
const NHAN = {
  ban_be:         'Đã là bạn',
  da_gui:         'Đã gửi lời mời',
  cho_minh_duyet: 'Đang chờ bạn duyệt',
  chan:           'Đã chặn',
};

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = oTim.value.trim();
  xoaBao();
  if (q.length < 2) return noi('Nhập ít nhất 2 ký tự để tìm.', 'loi');

  nutTim.disabled = true;
  try {
    const { data, error } = await supabase.rpc('tim_nguoi_choi', { tu_khoa: q });
    if (error) throw error;

    mKetQua.the.hidden = false;
    if (!data.length) {
      mKetQua.ds.replaceChildren(el('div', 'ash-trong', `Không tìm thấy ai khớp với "${q}".`));
      return;
    }
    mKetQua.ds.replaceChildren(...data.map((p) => hang(p, [
      p.trang_thai === 'chua'
        ? { label: 'Kết bạn', run: () => guiLoiMoi(p.id) }
        : { label: null, text: NHAN[p.trang_thai] },
    ])));
  } catch (err) {
    noi(dichLoi(err.message), 'loi');
  } finally {
    nutTim.disabled = false;
  }
});

await taiLai();
</script>
<script type="module" src="assets/js/chat.js"></script>
</body>
</html>
